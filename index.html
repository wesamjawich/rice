<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--page-->
<title>Rice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one screen. The print floats on a quiet studio table; a single dock of inks and dials sits beneath it. */
:root {
  --table: #dfe1e6;
  --table-2: #d3d6dd;
  --dock: #f7f8fa;
  --fg: #1c1f2b;
  --muted: #7d8395;
  --track: #c9cdd6;
  --ring: #1c1f2b;
  --paper: #f3eee3;
  --dock-hi: #ffffff;
  --dock-lo: #e9ebf0;
  --slot: #14161c;
  --led: #35c27a;
  --led-busy: #ffab2e;
  --glass: #0d1119;
  --glass-hi: #222b3b;
  --glass-ink: rgb(226 240 255 / .5);
  --lamp: #d9fff4;
  --shadow: 0 1px 1px rgba(20, 24, 40, .08), 0 18px 40px -12px rgba(20, 24, 40, .28);
  --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --table: #15171d; --table-2: #1b1e26; --dock: #23262f; --fg: #eceef4; --muted: #8b91a3;
    --track: #3b404d; --ring: #eceef4;
    --dock-hi: #2c303b; --dock-lo: #1e2129; --slot: #07080a;
    --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 18px 40px -12px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --table: #15171d; --table-2: #1b1e26; --dock: #23262f; --fg: #eceef4; --muted: #8b91a3;
  --track: #3b404d; --ring: #eceef4;
    --dock-hi: #2c303b; --dock-lo: #1e2129; --slot: #07080a;
  --shadow: 0 1px 1px rgba(0, 0, 0, .3), 0 18px 40px -12px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 90% at 50% 0%, var(--table), var(--table-2));
  background-color: var(--table);
  color: var(--fg);
  font-family: var(--ui);
  display: flex;
  flex-direction: column;
  gap: 0;
  padding-block: 20px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}

.stage {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template: minmax(0, 1fr) / minmax(0, 1fr);
  place-items: center;
  padding-bottom: 14px;
  overflow: hidden;
  overflow: clip;
  overflow-clip-margin: 0px;
}
.sheet {
  display: block;
  max-width: 100%;
  max-height: 100%;
  border: clamp(8px, 1.6vmin, 18px) solid var(--paper);
  background: var(--paper);
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .2s ease;
}
/* Before a photo arrives, the stage is the scanner glass: place the original here. */
.platen {
  appearance: none;
  position: relative;
  height: min(100%, 520px);
  aspect-ratio: 4 / 3;
  max-width: 100%;
  padding: 0;
  border: 12px solid var(--dock);
  border-radius: 16px;
  background: linear-gradient(135deg, var(--glass-hi), var(--glass) 45%, var(--glass) 70%, var(--glass-hi));
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .5), inset 0 10px 30px rgba(0, 0, 0, .7), 0 0 0 1px rgba(0, 0, 0, .08), var(--shadow);
  color: var(--glass-ink);
  cursor: pointer;
  overflow: hidden;
  transition: transform .2s ease;
}
/* ruler ticks along the top and left edges, like the size guides around a platen */
.platen::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(90deg, var(--glass-ink) 0 1px, transparent 1px 12px) 22px 0 / calc(100% - 22px) 5px no-repeat,
    repeating-linear-gradient(90deg, var(--glass-ink) 0 1px, transparent 1px 60px) 22px 0 / calc(100% - 22px) 10px no-repeat,
    repeating-linear-gradient(0deg, var(--glass-ink) 0 1px, transparent 1px 12px) 0 22px / 5px calc(100% - 22px) no-repeat,
    repeating-linear-gradient(0deg, var(--glass-ink) 0 1px, transparent 1px 60px) 0 22px / 10px calc(100% - 22px) no-repeat;
  opacity: .7;
}
/* the diagonal sheen of glass */
.platen::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .07) 38%, transparent 46%, transparent 58%, rgba(255, 255, 255, .04) 62%, transparent 68%);
  pointer-events: none;
}
.platen .corner { position: absolute; top: 5px; left: 5px; width: 13px; height: 13px; }
.platen .guide {
  position: absolute;
  inset: 16% 22%;
  display: grid;
  place-items: center;
  border: 1.5px dashed currentColor;
  border-radius: 6px;
  opacity: .8;
}
.platen .guide svg { width: 34px; height: 34px; }
.platen canvas {
  position: absolute;
  inset: 7%;
  width: 86%;
  height: 86%;
  object-fit: contain;
  filter: brightness(.82) saturate(.9);
}
.platen .lamp {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 16%;
  background: linear-gradient(90deg, transparent, rgb(from var(--lamp) r g b / .1) 55%, rgb(from var(--lamp) r g b / .5) 92%, var(--lamp) 97%, transparent);
  mix-blend-mode: screen;
  transform: translateX(-100%);
  animation: idle-scan 5.5s ease-in-out infinite;
  pointer-events: none;
}
@keyframes idle-scan { 0% { transform: translateX(-100%); } 40%, 100% { transform: translateX(640%); } }
.platen.scanning .guide { display: none; }
.platen.scanning .lamp { animation: none; }
.platen:not(.scanning) canvas { display: none; }
body.drag .platen { transform: scale(1.02); color: var(--lamp); }
body.drag .sheet { transform: scale(.97) rotate(-.6deg); }

/* The dock is the machine: paper feeds out of the slot along its top edge. */
.dock {
  align-self: center;
  position: relative;
  z-index: 1;
  max-width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 12px 22px;
  padding: 20px 16px 12px;
  background: linear-gradient(var(--dock-hi), var(--dock) 30%, var(--dock-lo));
  border-radius: 10px 10px 22px 22px;
  box-shadow: inset 0 1px 0 var(--dock-hi), inset 0 -2px 0 rgba(0, 0, 0, .08), var(--shadow);
}
.dock::before {
  content: "";
  position: absolute;
  top: 5px;
  left: 14px;
  right: 40px;
  height: 6px;
  border-radius: 3px;
  background: var(--slot);
  box-shadow: inset 0 2px 2px rgba(0, 0, 0, .6), 0 1px 0 var(--dock-hi);
}
.led {
  position: absolute;
  top: 4px;
  right: 16px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--led);
  box-shadow: 0 0 6px var(--led), inset 0 1px 1px rgba(255, 255, 255, .5);
}
.printing .led { background: var(--led-busy); box-shadow: 0 0 8px var(--led-busy); animation: blink .28s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.inks, .dials, .acts { display: flex; align-items: center; }
.inks { gap: 4px; flex-wrap: wrap; justify-content: center; }
.dials { gap: 16px; flex-wrap: wrap; justify-content: center; }
.acts { gap: 6px; }

.ink {
  appearance: none;
  border: 0;
  padding: 0;
  width: 44px;
  height: 36px;
  border-radius: 12px;
  background: transparent;
  cursor: pointer;
  position: relative;
  display: grid;
  place-items: center;
}
.ink i {
  display: flex;
  padding: 4px 8px;
  border-radius: 9px;
  background: var(--paper);
  isolation: isolate;
}
.ink b {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  margin-inline: -3.5px;
  mix-blend-mode: multiply;
}
.ink[aria-pressed="true"] i { outline: 2px solid var(--ring); outline-offset: 2px; }
.ink i { transition: transform .12s ease; box-shadow: 0 1px 0 rgba(0, 0, 0, .12), 0 2px 4px -1px rgba(0, 0, 0, .2); }
.ink:hover i { transform: translateY(-1px); }
.ink:active i, .ink[aria-pressed="true"] i { transform: translateY(1px); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .25); }

.dial { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.dial svg { width: 18px; height: 18px; flex: none; }
input[type="range"] {
  appearance: none;
  -webkit-appearance: none;
  width: 96px;
  height: 20px;
  margin: 0;
  background: transparent;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--track); }
input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--track); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px; margin-top: -5.5px;
  border-radius: 50%; background: var(--fg); border: 0;
}
input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--fg); border: 0; }

.act {
  appearance: none;
  border: 0;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: transparent;
  color: var(--fg);
  cursor: pointer;
  display: grid;
  place-items: center;
}
.act svg { width: 20px; height: 20px; }
.act:hover { background: var(--track); }
.act.primary { background: var(--fg); color: var(--dock); }
.act.primary:hover { opacity: .85; }
.act:active { transform: translateY(1px); }
.act[disabled] { opacity: .4; cursor: default; }

:is(.ink, .act, input):focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .sheet, .ink i, .platen { transition: none; } .platen .lamp { animation: none; } .printing .led { animation: none; } }
@media (max-width: 520px) {
  input[type="range"] { width: 72px; }
  .dials { gap: 10px; }
}
</style>

<main class="stage">
  <button class="platen" id="platen" title="Open a photo" aria-label="Open a photo">
    <svg class="corner" viewBox="0 0 13 13" fill="currentColor" aria-hidden="true"><path d="M0 0h13L0 13z"/></svg>
    <span class="guide"><svg viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M17 8v18M8 17h18"/></svg></span>
    <canvas id="orig" width="8" height="8"></canvas>
    <i class="lamp"></i>
  </button>
  <canvas class="sheet" id="out" width="8" height="8" title="Open a photo" hidden></canvas>
</main>

<div class="dock" id="dock">
  <span class="led" aria-hidden="true"></span>
  <div class="inks" id="inks" role="group" aria-label="Inks"></div>
  <div class="dials">
    <label class="dial" title="Dot size">
      <svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><circle cx="4" cy="4" r="2.2"/><circle cx="13" cy="4" r="1.4"/><circle cx="4" cy="13" r="1.4"/><circle cx="13" cy="13" r="3"/></svg>
      <input id="dot" type="range" min="0" max="14" step="0.5" value="5" aria-label="Dot size">
    </label>
    <label class="dial" title="Grain">
      <svg viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><circle cx="3" cy="5" r="1"/><circle cx="8" cy="3" r="1.3"/><circle cx="14" cy="6" r="1"/><circle cx="6" cy="9" r="1.2"/><circle cx="11" cy="10" r="1"/><circle cx="15" cy="12" r="1.3"/><circle cx="4" cy="14" r="1.1"/><circle cx="9" cy="15" r="1"/></svg>
      <input id="grain" type="range" min="0" max="1" step="0.02" value="0.5" aria-label="Grain">
    </label>
    <label class="dial" title="Misregistration">
      <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="2" width="10" height="10" rx="1"/><rect x="6" y="6" width="10" height="10" rx="1"/></svg>
      <input id="shift" type="range" min="0" max="8" step="0.25" value="2" aria-label="Misregistration">
    </label>
  </div>
  <div class="acts">
    <button class="act" id="open" title="Open a photo" aria-label="Open a photo">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><circle cx="7" cy="8" r="1.4"/><path d="m3 14 4-3.5 3 2.5 3-3 4 4"/></svg>
    </button>
    <button class="act primary" id="save" disabled title="Save PNG" aria-label="Save PNG">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v10m0 0-4-4m4 4 4-4M4 16.5h12"/></svg>
    </button>
  </div>
</div>
<input id="file" type="file" accept="image/*" hidden>

<script>
(() => {
  const PAPER = [243, 238, 227];
  const INK = {
    black: [34, 32, 36], blue: [0, 120, 191], pink: [255, 72, 176], red: [241, 80, 96],
    yellow: [255, 232, 0], teal: [0, 131, 138], orange: [255, 108, 47], sun: [255, 181, 17],
    purple: [118, 91, 167], green: [0, 169, 92], burgundy: [145, 78, 114], mint: [130, 216, 213],
    cyan: [0, 166, 228], magenta: [240, 50, 150],
  };
  const SETS = [
    { name: 'CMYK', cmyk: true, inks: [INK.cyan, INK.magenta, INK.yellow, INK.black] },
    { name: 'Pink + Blue', inks: [INK.pink, INK.blue] },
    { name: 'Yellow + Pink + Blue', inks: [INK.yellow, INK.pink, INK.blue] },
    { name: 'Red + Teal', inks: [INK.red, INK.teal] },
    { name: 'Orange + Blue', inks: [INK.orange, INK.blue] },
    { name: 'Sunflower + Purple', inks: [INK.sun, INK.purple] },
    { name: 'Mint + Burgundy', inks: [INK.mint, INK.burgundy] },
    { name: 'Green + Pink', inks: [INK.green, INK.pink] },
    { name: 'Black', inks: [INK.black] },
  ];
  const ANGLES = [15, 75, 0, 45].map(a => a * Math.PI / 180);
  const DRIFT = [[1, 0.4], [-0.7, 0.8], [0.3, -1], [-0.6, -0.5]];
  const PREVIEW = 1100, EXPORT = 3000;

  const $ = id => document.getElementById(id);
  const out = $('out'), ctx = out.getContext('2d');
  const state = { set: 1, source: null, pixels: null, planes: null };

  // ---------- separation: photo -> one density plane per ink ----------
  function separate(img, set) {
    const { data, width, height } = img, n = width * height, k = set.inks.length;
    const planes = set.inks.map(() => new Float32Array(n));
    if (set.cmyk) {
      for (let p = 0, i = 0; p < n; p++, i += 4) {
        const r = data[i] / 255, g = data[i + 1] / 255, b = data[i + 2] / 255;
        const key = Math.pow(1 - Math.max(r, g, b), 1.6), d = 1 - key || 1;
        planes[0][p] = (1 - r - key) / d;
        planes[1][p] = (1 - g - key) / d;
        planes[2][p] = (1 - b - key) / d;
        planes[3][p] = key;
      }
      return planes;
    }
    // Fit each pixel as a mix of the inks in absorbance space (box-constrained
    // least squares), with a luminance row so tone survives hues the inks can't hit.
    const FLOOR = 0.08, LW = 1.5;
    const ab = v => -Math.log(Math.max(v, FLOOR));
    const lum = (r, g, b) => 0.299 * r + 0.587 * g + 0.114 * b;
    const K = set.inks.map(([r, g, b]) => [ab(r / 255), ab(g / 255), ab(b / 255), LW * ab(lum(r, g, b) / 255)]);
    const G = K.map(a => K.map(b => a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3]));
    const lut = new Float32Array(256);
    for (let v = 0; v < 256; v++) lut[v] = ab(v / 255);
    const bv = new Float64Array(k), dv = new Float64Array(k);
    for (let p = 0, i = 0; p < n; p++, i += 4) {
      const r = data[i], g = data[i + 1], b = data[i + 2];
      const a0 = lut[r], a1 = lut[g], a2 = lut[b], a3 = LW * ab(lum(r, g, b) / 255);
      for (let j = 0; j < k; j++) { bv[j] = K[j][0] * a0 + K[j][1] * a1 + K[j][2] * a2 + K[j][3] * a3; dv[j] = 0; }
      for (let it = 0; it < 6; it++) {
        for (let j = 0; j < k; j++) {
          let s = bv[j];
          for (let m = 0; m < k; m++) if (m !== j) s -= G[j][m] * dv[m];
          s /= G[j][j];
          dv[j] = s < 0 ? 0 : s > 1 ? 1 : s;
        }
      }
      for (let j = 0; j < k; j++) planes[j][p] = dv[j];
    }
    return planes;
  }

  // ---------- press: halftone, grain and misregistration, multiplied onto paper ----------
  function press(planes, w, h, set, o, scale, passes = set.inks.length) {
    const img = new ImageData(w, h), px = img.data, n = w * h;
    const acc = new Float32Array(n * 3);
    for (let p = 0, j = 0; p < n; p++) {
      const x = (p % w) / scale | 0, y = (p / w | 0) / scale | 0;
      const t = 1 - 0.035 * o.grain * noise(x, y, 9);
      acc[j++] = PAPER[0] * t; acc[j++] = PAPER[1] * t; acc[j++] = PAPER[2] * t;
    }
    const period = o.dot * scale, screen = o.dot >= 2.5;
    const sharp = period / 2, gain = 1 + 1 / sharp, bias = 0.5 / sharp;
    set.inks.slice(0, passes).forEach((ink, li) => {
      const plane = planes[li];
      const th = ANGLES[set.inks.length === 1 ? 3 : li], f = 2 * Math.PI / period;
      const cs = Math.cos(th) * f, sn = Math.sin(th) * f;
      // cos(a·x + b·y) expanded per axis, so the inner loop needs no trig
      const xc1 = new Float32Array(w), xs1 = new Float32Array(w), xc2 = new Float32Array(w), xs2 = new Float32Array(w);
      for (let x = 0; x < w; x++) {
        xc1[x] = Math.cos(x * cs); xs1[x] = Math.sin(x * cs);
        xc2[x] = Math.cos(-x * sn); xs2[x] = Math.sin(-x * sn);
      }
      const ox = Math.round(DRIFT[li][0] * o.shift * scale), oy = Math.round(DRIFT[li][1] * o.shift * scale);
      const mr = 1 - ink[0] / 255, mg = 1 - ink[1] / 255, mb = 1 - ink[2] / 255;
      for (let y = 0; y < h; y++) {
        const yc1 = Math.cos(y * sn), ys1 = Math.sin(y * sn), yc2 = Math.cos(y * cs), ys2 = Math.sin(y * cs);
        const sy = Math.min(h - 1, Math.max(0, y - oy)) * w, ny = y / scale | 0;
        for (let x = 0; x < w; x++) {
          const sx = x - ox;
          let c = plane[sy + (sx < 0 ? 0 : sx >= w ? w - 1 : sx)];
          if (c <= 0.004) continue;
          if (screen) {
            const t = 0.5 + (xc1[x] * yc1 - xs1[x] * ys1 + xc2[x] * yc2 - xs2[x] * ys2) / 4;
            c = (c * gain - bias - t) * sharp + 0.5;
            if (c <= 0) continue;
            if (c > 1) c = 1;
          }
          const nz = noise(x / scale | 0, ny, li);
          c *= 0.95 * (1 - o.grain * 0.55 * nz);
          if (nz > 1 - 0.1 * o.grain) c *= 0.3;
          const j = (y * w + x) * 3;
          acc[j] *= 1 - c * mr; acc[j + 1] *= 1 - c * mg; acc[j + 2] *= 1 - c * mb;
        }
      }
    });
    for (let p = 0, i = 0, j = 0; p < n; p++, i += 4) {
      px[i] = acc[j++]; px[i + 1] = acc[j++]; px[i + 2] = acc[j++]; px[i + 3] = 255;
    }
    return img;
  }

  function noise(x, y, s) {
    let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s + 1, 1442695041) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  }

  // ---------- plumbing ----------
  function rasterize(source, longEdge) {
    const sw = source.width, sh = source.height;
    const k = Math.min(1, longEdge / Math.max(sw, sh));
    const w = Math.max(1, Math.round(sw * k)), h = Math.max(1, Math.round(sh * k));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
    g.imageSmoothingQuality = 'high';
    g.drawImage(source, 0, 0, w, h);
    return g.getImageData(0, 0, w, h);
  }
  const options = () => ({ dot: +$('dot').value, grain: +$('grain').value, shift: +$('shift').value });
  const scaleOf = img => Math.max(img.width, img.height) / PREVIEW;

  let queued = false;
  function draw() {
    if (!state.pixels) return;
    job++;
    $('dock').classList.remove('printing');
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      const { pixels, planes } = state;
      const img = press(planes, pixels.width, pixels.height, SETS[state.set], options(), Math.max(0.5, scaleOf(pixels)));
      ctx.putImageData(img, 0, 0);
    });
  }
  // ---------- printing: paper feeds out, then each ink goes down in its own pass ----------
  let job = 0;
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const frame = () => new Promise(r => requestAnimationFrame(r));
  function layer(passes) {
    const { pixels, planes } = state;
    const c = document.createElement('canvas');
    c.width = pixels.width; c.height = pixels.height;
    c.getContext('2d').putImageData(press(planes, c.width, c.height, SETS[state.set], options(), Math.max(0.5, scaleOf(pixels)), passes), 0, 0);
    return c;
  }
  async function print(feed) {
    if (still.matches) return draw();
    const id = ++job, set = SETS[state.set], w = out.width, h = out.height;
    $('dock').classList.add('printing');
    let under = layer(0);
    ctx.drawImage(under, 0, 0);
    if (feed) {
      const dist = out.parentElement.clientHeight + 'px';
      await out.animate([{ transform: `translateY(${dist})` }, { transform: 'none' }],
        { duration: 750, easing: 'cubic-bezier(.3, .7, .2, 1)' }).finished.catch(() => {});
    }
    for (let k = 1; k <= set.inks.length && id === job; k++) {
      const over = layer(k), ink = set.inks[k - 1], band = Math.max(10, h * 0.035);
      const t0 = performance.now(), dur = 420;
      for (let t = 0; t < 1 && id === job;) {
        await frame();
        if (id !== job) return;
        t = Math.min(1, (performance.now() - t0) / dur);
        const y = Math.round((h + band) * t);
        ctx.drawImage(under, 0, 0);
        if (y > 0) ctx.drawImage(over, 0, 0, w, Math.min(y, h), 0, 0, w, Math.min(y, h));
        // the drum: a wet band of this pass's ink leading the printed edge
        const g = ctx.createLinearGradient(0, y - band, 0, y);
        g.addColorStop(0, `rgb(${ink.join(' ')} / 0)`);
        g.addColorStop(0.75, `rgb(${ink.join(' ')} / .55)`);
        g.addColorStop(1, `rgb(${ink.join(' ')} / .9)`);
        ctx.fillStyle = g;
        ctx.fillRect(0, y - band, w, band);
      }
      under = over;
    }
    if (id !== job) return;
    ctx.drawImage(under, 0, 0);
    $('dock').classList.remove('printing');
  }

  function reseparate(feed) {
    if (!state.pixels) return;
    state.planes = separate(state.pixels, SETS[state.set]);
    print(feed);
  }
  // A new original goes on the glass, the lamp reads it once, then the print feeds out.
  let load = 0;
  async function setSource(source) {
    const id = ++load, platen = $('platen');
    state.source = source;
    state.pixels = rasterize(source, PREVIEW);
    state.planes = separate(state.pixels, SETS[state.set]);
    out.width = state.pixels.width; out.height = state.pixels.height;
    $('save').disabled = false;
    if (!still.matches) {
      const orig = $('orig');
      orig.width = out.width; orig.height = out.height;
      orig.getContext('2d').putImageData(state.pixels, 0, 0);
      out.hidden = true; platen.hidden = false;
      platen.classList.add('scanning');
      $('dock').classList.add('printing');
      await platen.querySelector('.lamp').animate(
        [{ transform: 'translateX(-100%)' }, { transform: 'translateX(640%)' }],
        { duration: 900, easing: 'cubic-bezier(.4, 0, .6, 1)' }).finished.catch(() => {});
      if (id !== load) return;
      platen.classList.remove('scanning');
    }
    platen.hidden = true; out.hidden = false;
    print(true);
  }
  async function openFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    try { setSource(await createImageBitmap(file)); } catch (e) { /* unreadable image: keep the current print */ }
  }

  async function save() {
    if (!state.source) return;
    const btn = $('save');
    btn.disabled = true;
    await new Promise(r => setTimeout(r, 30));
    try {
      const set = SETS[state.set];
      const pixels = rasterize(state.source, EXPORT);
      const img = press(separate(pixels, set), pixels.width, pixels.height, set, options(), Math.max(0.5, scaleOf(pixels)));
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      c.getContext('2d').putImageData(img, 0, 0);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      const filename = 'rice-' + set.name.toLowerCase().replace(/[^a-z]+/g, '-') + '.png';
      // Inside a Claude artifact, saves go through the host; elsewhere a plain download link works.
      const host = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (host) {
        await host.save({ filename, data: blob }).catch(() => {});
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }
    } finally { btn.disabled = false; }
  }

  // ---------- UI ----------
  const css = c => `rgb(${c.join(' ')})`;
  SETS.forEach((set, i) => {
    const b = document.createElement('button');
    b.className = 'ink'; b.title = set.name; b.setAttribute('aria-label', set.name);
    b.setAttribute('aria-pressed', i === state.set);
    b.innerHTML = '<i>' + set.inks.map(c => `<b style="background:${css(c)}"></b>`).join('') + '</i>';
    b.onclick = () => {
      state.set = i;
      document.querySelectorAll('.ink').forEach((el, j) => el.setAttribute('aria-pressed', j === i));
      reseparate(false);
    };
    $('inks').append(b);
  });
  ['dot', 'grain', 'shift'].forEach(id => $(id).addEventListener('input', draw));
  const file = $('file');
  $('open').onclick = out.onclick = $('platen').onclick = () => file.click();
  file.onchange = () => { openFile(file.files[0]); file.value = ''; };
  $('save').onclick = save;
  addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
  addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag'); });
  addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drag'); openFile(e.dataTransfer.files[0]); });
  addEventListener('paste', e => openFile([...e.clipboardData.files][0]));

})();
</script>
<!--/page-->
</body>
</html>
